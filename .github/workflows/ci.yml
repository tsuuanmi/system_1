name: ci

# The full gate runs only when work is merged, not on every commit or pull request
# (docs/engineering/testing.md#ci-gates): every push to dev, so every merge into it, and each
# release tag, through the release workflow. A dev -> main pull request's head is dev's tip, so
# main's required checks are the ones that ran on dev.
on:
  push:
    branches: [dev]
  # The release workflow runs these same gates on the tagged commit.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    # One name on every trigger: main's ruleset requires it by this name.
    name: node ${{ matrix.node }} / check + test + e2e
    runs-on: ubuntu-24.04  # pinned: a new image can change the user-namespace policy bubblewrap needs
    strategy:
      fail-fast: false
      matrix:
        # The floor of the supported range (CON-2), and the latest of each line.
        node: ['24.18.1', '24', '26']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: real display, browser, and bubblewrap for provider-runtime and agent tests
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb tigervnc-scraping-server bubblewrap
          # Ubuntu 23.10+ restricts unprivileged user namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          google-chrome --version
          bwrap --dev-bind / / -- true
      - run: pnpm check
      - name: the whole test suite
        run: pnpm test
        env:
          SYSTEM_REQUIRE_BROWSER: '1'
          SYSTEM_REQUIRE_BWRAP: '1'
      - run: pnpm test:e2e
      - name: crash injection (SIGKILL at each reconcile point of a turn)
        run: pnpm test:crash

name: ci

# The full gate runs only when work is merged, not on every commit or pull request
# (docs/engineering/testing.md#ci-gates, ADR-0085): every push to dev, so every merge into it, and
# each release tag, through the release workflow. A dev -> main pull request's head is dev's tip, so
# main's required check, `ci gate`, is the one that ran on dev. One Node version, the latest 24;
# the check, the suite in four shards, e2e, and crash injection run side by side.
on:
  push:
    branches: [dev]
  # The release workflow runs these same gates on the tagged commit.
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '24'

jobs:
  check:
    name: check
    runs-on: ubuntu-24.04  # pinned: a new image can change the user-namespace policy bubblewrap needs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  test:
    name: test ${{ matrix.shard }}/4
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: bubblewrap for the sandbox's own tests (ADR-0084)
        run: |
          sudo apt-get update && sudo apt-get install -y bubblewrap
          # Ubuntu 23.10+ restricts unprivileged user namespaces, which bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          bwrap --dev-bind / / -- true
      - name: the test suite, shard ${{ matrix.shard }} of 4
        run: pnpm test --shard=${{ matrix.shard }}/4
        env:
          SYSTEM_REQUIRE_BWRAP: '1'

  e2e:
    name: e2e
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: real display, browser, and bubblewrap for the shipped profile
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb tigervnc-scraping-server bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          google-chrome --version
          bwrap --dev-bind / / -- true
      - run: pnpm test:e2e

  crash:
    name: crash injection
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: real display, browser, and bubblewrap for the crash stacks
        run: |
          sudo apt-get update && sudo apt-get install -y xvfb tigervnc-scraping-server bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          google-chrome --version
          bwrap --dev-bind / / -- true
      - name: crash injection (SIGKILL at each reconcile point of a turn)
        run: pnpm test:crash

  gate:
    # The one required check (main's ruleset names it): every job above succeeded.
    name: ci gate
    needs: [check, test, e2e, crash]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - run: echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success")'
